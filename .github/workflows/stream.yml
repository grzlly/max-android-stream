name: Max Android Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool x11-utils x11-xserver-utils scrcpy nodejs npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force

          echo "hw.lcd.width=720"   >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes"    >> $ANDROID_AVD_HOME/max_device.avd/config.ini

          avdmanager list avd

      - name: Setup Web UI and Orchestrator
        run: |
          mkdir -p /opt/orchestrator
          cd /opt/orchestrator
          npm init -y
          npm install express http-proxy-middleware

          cat << 'EOF' | sudo tee /opt/orchestrator/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max Emulator</title>
              <style>
                  body { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; }
                  iframe { width: 720px; height: 1280px; min-width: 720px; min-height: 1280px; flex-shrink: 0; border: none; display: none; transform-origin: top center; }
                  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; padding: 20px; box-sizing: border-box; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              </style>
              <script>
                  function updateScale() {
                      var phoneRatio = 720 / 1280;
                      var windowRatio = window.innerWidth / window.innerHeight;
                      var scale;
                      
                      if (windowRatio < phoneRatio) {
                          scale = window.innerWidth / 720;
                      } else {
                          scale = window.innerHeight / 1280;
                      }
                      
                      var f = document.getElementById('vnc-frame');
                      if(f) {
                          f.style.transform = 'scale(' + scale + ')';
                          document.body.style.height = (1280 * scale) + 'px';
                      }
                  }
                  window.addEventListener('resize', updateScale);

                  let iframeLoaded = false;
                  
                  setInterval(() => {
                      fetch('/ping').then(r => r.json()).then(d => {
                          if (!d.ok) window.location.reload();
                      }).catch(() => {});
                  }, 3000);

                  const checkReady = setInterval(() => {
                      if (iframeLoaded) { clearInterval(checkReady); return; }
                      fetch('/status').then(r => r.json()).then(d => {
                          if (d.ready) {
                              document.getElementById('loading').style.display = 'none';
                              const f = document.getElementById('vnc-frame');
                              f.src = 'vnc.html?autoconnect=true&resize=off&show_dot=true&reconnect=true&reconnect_delay=1000&path=websockify';
                              f.style.display = 'block';
                              iframeLoaded = true;
                              updateScale();
                              clearInterval(checkReady);
                              
                              f.onload = function() {
                                  try {
                                      var bar = f.contentDocument.getElementById('noVNC_control_bar_anchor');
                                      if (bar) bar.style.display = 'none';
                                  } catch(e) {}
                              };
                          }
                      }).catch(() => {});
                  }, 2000);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <h2>Подготовка устройства...</h2>
                  <p>Очистка данных и запуск, подождите (до 10 секунд).</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          EOF

          cat << 'EOF' | sudo tee /opt/orchestrator/busy.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Сессия занята</title><style>body{background:#222;color:white;text-align:center;padding-top:20%;font-family:sans-serif;}</style></head>
          <body>
              <h1>Сессия занята другим пользователем.</h1>
              <p>Пожалуйста, подождите, пока он освободит систему, и обновите страницу.</p>
          </body>
          </html>
          EOF

          cat << 'EOF' | sudo tee /opt/orchestrator/server.js
          const express = require('express');
          const { createProxyMiddleware } = require('http-proxy-middleware');
          const { execSync } = require('child_process');

          const app = express();
          let session = { ip: null, expiresAt: 0, isReady: false };
          const ADB = process.env.ANDROID_HOME + "/platform-tools/adb";

          let PACKAGE_NAME = "com.vk.im";
          try {
              const out = execSync("aapt dump badging /home/runner/work/max-android-stream/max-android-stream/max.apk | grep '^package' | grep -oP \"name='\\K[^']+\" | head -1").toString().trim();
              if (out) PACKAGE_NAME = out;
          } catch (e) {
              console.error("Failed to detect package name, defaulting to com.vk.im");
          }

          function resetSession(ip) {
              session.isReady = false;
              session.ip = ip;
              session.expiresAt = Date.now() + 60 * 60 * 1000; // 1 hour
              
              setTimeout(() => {
                  try {
                      console.log("Clearing app data for " + PACKAGE_NAME);
                      execSync(`${ADB} -s emulator-5554 shell pm clear ${PACKAGE_NAME}`);
                      console.log("Relaunching app...");
                      execSync(`${ADB} -s emulator-5554 shell monkey -p ${PACKAGE_NAME} -c android.intent.category.LAUNCHER 1`);
                      setTimeout(() => { session.isReady = true; }, 3000);
                  } catch(e) {
                      console.error("Reset error:", e);
                      session.isReady = true;
                  }
              }, 1000);
          }

          function getIp(req) {
              return req.headers['x-forwarded-for'] || req.headers['x-real-ip'] || req.socket.remoteAddress;
          }

          app.get('/', (req, res) => {
              let ip = getIp(req);
              if (Date.now() > session.expiresAt) {
                  console.log("New session started for " + ip);
                  resetSession(ip);
                  res.sendFile(__dirname + '/index.html');
              } else if (session.ip === ip) {
                  console.log("Existing session reconnected for " + ip);
                  res.sendFile(__dirname + '/index.html');
              } else {
                  console.log("Session busy. Rejecting " + ip);
                  res.sendFile(__dirname + '/busy.html');
              }
          });

          app.get('/status', (req, res) => {
              res.json({ ready: session.isReady });
          });

          app.get('/ping', (req, res) => {
              if (session.ip === getIp(req) && Date.now() < session.expiresAt) {
                  res.json({ ok: true });
              } else {
                  res.json({ ok: false });
              }
          });

          app.use('/websockify', createProxyMiddleware({
              target: 'http://127.0.0.1:8001',
              changeOrigin: true,
              ws: true,
              onProxyReqWs: (proxyReq, req, socket, options, head) => {
                  let ip = getIp(req);
                  if (session.ip !== ip || Date.now() > session.expiresAt || !session.isReady) {
                      console.log("Rejected WS connection from " + ip);
                      socket.destroy();
                  }
              }
          }));

          app.use(express.static('/usr/share/novnc'));

          app.listen(8000, '0.0.0.0', () => console.log('Orchestrator running on port 8000'));
          EOF

      - name: Start display, emulator and VNC
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # 1. Xvfb with HUGE screen so scrcpy doesn't shrink the window automatically
          Xvfb :0 -screen 0 2000x2000x24 &
          export DISPLAY=:0
          for i in $(seq 1 30); do
            xdpyinfo -display :0 >/dev/null 2>&1 && echo "Xvfb ready" && break
            sleep 1
          done

          # 2. Fluxbox: force window to 0,0 and no decorations
          mkdir -p ~/.fluxbox
          printf '[app] (.*)\n  [Deco] {NONE}\n  [Position] (UPPERLEFT) {0 0}\n[end]\n' > ~/.fluxbox/apps
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          fluxbox -display :0 2>/dev/null &
          sleep 2
          
          # Force black background to hide Ubuntu logo completely
          xsetroot -solid black -display :0 &

          # 3. Start ADB before emulator
          $ADB start-server
          echo "ADB daemon started"

          # 4. Start emulator with -no-window:
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -no-skin -no-metrics \
            -no-window &
          echo "Emulator started in headless mode"

          # 5. Wait for ADB online (up to 3 min)
          echo "Waiting for ADB..."
          for i in $(seq 1 36); do
            STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
            if [ "$STATE" = "device" ]; then
              echo "ADB online!"
              break
            fi
            if [ "$STATE" = "offline" ]; then
              $ADB -s emulator-5554 reconnect offline 2>/dev/null || true
            fi
            echo "ADB: $STATE ($i/36)"
            sleep 5
          done

          # 6. Wait for Android to fully boot
          echo "Waiting for Android boot..."
          for i in $(seq 1 60); do
            BOOT=$($ADB -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            echo "Boot: '$BOOT' ($i/60)"
            sleep 5
          done
          sleep 5

          # 7. Launch scrcpy (it will open at natural 720x1280 size because Xvfb is huge)
          DISPLAY=:0 scrcpy \
            -s emulator-5554 \
            --max-fps 30 \
            2>/dev/null &
          sleep 4
          echo "scrcpy rendering Android screen at 30fps"

          # 8. Start VNC capturing ONLY the 720x1280 region where scrcpy is
          x11vnc -display :0 -clip 720x1280+0+0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -noncache -shared -defer 0
          
          # 9. Start websockify on internal port 8001 (Node.js orchestrator proxies to this)
          websockify 8001 localhost:5900 &
          echo "websockify running on :8001"

          # 10. Start Node.js Orchestrator on public port 8000
          export ANDROID_HOME=$ANDROID_HOME
          cd /opt/orchestrator
          node server.js &
          echo "Orchestrator running on :8000"

      - name: Install Max and apply Kiosk Mode
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Do NOT restart ADB - scrcpy is connected to it!
          STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
          echo "ADB state: $STATE"
          if [ "$STATE" != "device" ]; then
            echo "ERROR: Device not ready! State=$STATE"
            $ADB devices -l
            exit 1
          fi

          echo "Installing Max APK..."
          $ADB -s emulator-5554 install -r max.apk

          echo "Applying Kiosk Mode..."
          $ADB -s emulator-5554 shell settings put secure lockscreen.disabled 1
          
          # Keep System UI enabled so user has back/home buttons if they get stuck in browser
          # $ADB -s emulator-5554 shell pm disable-user --user 0 com.android.systemui
          
          $ADB -s emulator-5554 shell settings put global window_animation_scale 0
          $ADB -s emulator-5554 shell settings put global transition_animation_scale 0
          $ADB -s emulator-5554 shell settings put global animator_duration_scale 0

          # Disable Chrome to prevent external links from opening in a browser
          $ADB -s emulator-5554 shell pm disable-user --user 0 com.android.chrome >/dev/null 2>&1 || true

          PACKAGE_NAME=$(aapt dump badging max.apk | grep '^package' | grep -oP "name='\K[^']+" | head -1 | tr -d '[:space:]')
          echo "Package: $PACKAGE_NAME"

          echo "Launching Max..."
          $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1

          echo "Starting foreground watchdog..."
          (
            while true; do
              # Get the currently focused window's package name
              FOCUS=$($ADB -s emulator-5554 shell dumpsys window windows 2>/dev/null | grep -E 'mCurrentFocus' | awk -F'/' '{print $1}' | awk '{print $NF}' | tr -d '\r')
              
              if [ -n "$FOCUS" ] && [ "$FOCUS" != "mCurrentFocus=null" ]; then
                # Whitelist our app and core system UI components
                if [ "$FOCUS" != "$PACKAGE_NAME" ] && \
                   [ "$FOCUS" != "com.android.permissioncontroller" ] && \
                   [ "$FOCUS" != "com.android.systemui" ] && \
                   [ "$FOCUS" != "com.google.android.inputmethod.latin" ]; then
                  
                  echo "Watchdog: Unwanted app $FOCUS is in foreground. Killing it and relaunching $PACKAGE_NAME..."
                  
                  # Force stop the interfering app (unless it's core android)
                  if [ "$FOCUS" != "android" ]; then
                    $ADB -s emulator-5554 shell am force-stop "$FOCUS" >/dev/null 2>&1 || true
                  fi
                  
                  # Relaunch Max
                  $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
                fi
              fi
              sleep 2
            done
          ) &

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000