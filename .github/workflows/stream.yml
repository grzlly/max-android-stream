name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD (Top Tier Performance)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          # Reverted back to google_apis because WhiteMAX crashes on clean AOSP
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force
          
          # MAXIMUM PERFORMANCE SETTINGS
          # Keep at 2 cores because GitHub Actions KVM only supports 2. 4 cores triggers a blocking Qt warning popup!
          echo "hw.cpu.ncore=2" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.ramSize=3072" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "vm.heapSize=512" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          
          # Exact 720p Resolution Setup
          echo "hw.lcd.width=720" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          
          avdmanager list avd

      - name: Setup Web UI (Scale OFF by default)
        run: |
          cat << 'EOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max Emulator</title>
              <style>
                  body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; }
                  iframe { width: 100vw; height: 100vh; border: none; display: none; }
                  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              </style>
              <script>
                  setTimeout(() => {
                      document.getElementById('loading').style.display = 'none';
                      const f = document.getElementById('vnc-frame');
                      // resize=off fixes the tiny vertical line issue on desktop!
                      f.src = 'vnc.html?autoconnect=true&resize=off&show_dot=true';
                      f.style.display = 'block';
                  }, 5000);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <h2>Установка и запуск эмулятора...</h2>
                  <p>Пожалуйста, подождите (до 60-90 секунд).</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          EOF

      - name: Start virtual display + headless emulator + VNC
        run: |
          Xvfb :0 -screen 0 720x1280x24 &
          export DISPLAY=:0
          
          # Pure borderless setup via fluxbox
          mkdir -p ~/.fluxbox
          cat << 'EOF' > ~/.fluxbox/apps
          [app] (.*)
            [Deco] {NONE}
            [Position] (UPPERLEFT) {0 0}
          [end]
          EOF
          cat << 'EOF' > ~/.fluxbox/init
          session.screen0.toolbar.visible: false
          EOF
          fluxbox -display :0 &
          
          # Native Emulator Window WITHOUT hardware buttons (-no-skin)
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-skin &

          echo "Waiting for emulator window to appear..."
          sleep 10
          
          # Force the window to exactly fill the 720x1280 screen, removing ALL black borders
          WID=$(xdotool search --sync --onlyvisible --class "qemu" | head -1 || echo "")
          if [ ! -z "$WID" ]; then
            echo "Resizing emulator window $WID to 720x1280"
            xdotool windowsize $WID 720 1280
            xdotool windowmove $WID 0 0
          else
            echo "Failed to find emulator window with xdotool"
          fi

          $ANDROID_HOME/platform-tools/adb wait-for-device
          echo "Waiting for full boot..."
          for i in $(seq 1 90); do
            boot=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && echo "Booted!" && break
            sleep 5
          done

          # Run x11vnc with performance tuning (60fps feel)
          x11vnc -display :0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -ncache 10 -shared -defer 0
          
          # noVNC websockify on port 8000
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install and launch Max
        run: |
          echo "Installing Max APK..."
          $ANDROID_HOME/platform-tools/adb install -r max.apk || true
          
          # --- TRUE KIOSK MODE & PERFORMANCE ---
          $ANDROID_HOME/platform-tools/adb shell settings put secure lockscreen.disabled 1
          
          echo "Killing System UI for True Kiosk Mode..."
          $ANDROID_HOME/platform-tools/adb shell pm disable-user --user 0 com.android.systemui
          
          echo "Disabling animations for maximum speed..."
          $ANDROID_HOME/platform-tools/adb shell settings put global window_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global transition_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global animator_duration_scale 0
          
          PACKAGE_NAME=$(aapt dump badging max.apk | grep package | grep -oP "name='\K[^']+")
          echo "Detected package name: $PACKAGE_NAME"
          
          echo "Launching Max..."
          $ANDROID_HOME/platform-tools/adb shell monkey -p $PACKAGE_NAME -c android.intent.category.LAUNCHER 1 || true

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
