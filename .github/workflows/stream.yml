name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool x11-utils

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force

          echo "hw.lcd.width=720"   >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes"    >> $ANDROID_AVD_HOME/max_device.avd/config.ini

          avdmanager list avd

      - name: Setup Web UI
        run: |
          # Write the main loading page (restored original design)
          cat << 'EOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max Emulator</title>
              <style>
                  body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; }
                  iframe { width: 100vw; height: 100vh; border: none; display: none; }
                  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              </style>
              <script>
                  setTimeout(function() {
                      document.getElementById('loading').style.display = 'none';
                      var f = document.getElementById('vnc-frame');
                      f.src = 'vnc.html?autoconnect=true&resize=off&show_dot=true';
                      f.style.display = 'block';
                  }, 7000);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <h2>Установка и запуск эмулятора...</h2>
                  <p>Пожалуйста, подождите (до 60-90 секунд).</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          EOF

          # Hide the noVNC left control bar (the panel with icons that appears on the left in the browser)
          sudo sed -i 's|</head>|<style>#noVNC_control_bar_anchor,#noVNC_control_bar_hint{display:none!important;width:0!important;}</style></head>|' /usr/share/novnc/vnc.html

      - name: Start display, emulator and VNC
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # 1. Start Xvfb larger than Android screen to accommodate emulator's own Qt toolbar
          # We will crop to 720x1280 via x11vnc later
          Xvfb :0 -screen 0 900x1400x24 &
          export DISPLAY=:0
          for i in $(seq 1 30); do
            xdpyinfo -display :0 >/dev/null 2>&1 && echo "Xvfb ready" && break
            sleep 1
          done

          # 2. Fluxbox: borderless, no toolbar
          mkdir -p ~/.fluxbox
          printf '[app] (.*)\n  [Deco] {NONE}\n  [Position] (UPPERLEFT) {0 0}\n[end]\n' > ~/.fluxbox/apps
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          fluxbox -display :0 2>/dev/null &
          sleep 2

          # 3. Start ADB BEFORE the emulator
          $ADB start-server
          echo "ADB daemon started"

          # 4. Start emulator
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -no-skin -no-metrics &
          EMU_PID=$!
          echo "Emulator started (PID: $EMU_PID)"

          # 5. Popup dismisser runs in BACKGROUND - targets active window every second
          # Handles: "4 CPU cores" warning, "Nested Virtualization" warning, and any other dialogs
          export DISPLAY=:0
          (
            sleep 8
            echo "[dismiss] Popup dismissal started"
            for i in $(seq 1 120); do
              ACTIVE=$(xdotool getactivewindow 2>/dev/null || echo "")
              if [ -n "$ACTIVE" ]; then
                xdotool key --window "$ACTIVE" --clearmodifiers Return 2>/dev/null || true
              fi
              sleep 1
            done
            echo "[dismiss] Done"
          ) &
          DISMISS_PID=$!

          # 6. Wait for ADB online (up to 3 min)
          echo "Waiting for ADB..."
          for i in $(seq 1 36); do
            STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
            if [ "$STATE" = "device" ]; then
              echo "ADB online!"
              break
            fi
            if [ "$STATE" = "offline" ]; then
              $ADB -s emulator-5554 reconnect offline 2>/dev/null || true
            fi
            echo "ADB: $STATE ($i/36)"
            sleep 5
          done

          # 7. Wait for Android boot
          echo "Waiting for boot..."
          for i in $(seq 1 60); do
            BOOT=$($ADB -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            echo "Boot: '$BOOT' ($i/60)"
            sleep 5
          done
          sleep 5

          # 8. Kill dismisser
          kill $DISMISS_PID 2>/dev/null || true

          # 9. Auto-detect emulator window geometry and position the Android screen at (0,0)
          WID=$(xdotool search --onlyvisible --class "qemu" 2>/dev/null | head -1 || true)
          if [ -n "$WID" ]; then
            # Get the full emulator window size (includes Qt sidebar + title bar)
            GEOM_LINE=$(xdotool getwindowgeometry "$WID" 2>/dev/null | grep "Geometry:" || echo "Geometry: 772x1310")
            WIN_W=$(echo "$GEOM_LINE" | grep -oP '\d+(?=x)' | head -1 || echo "772")
            WIN_H=$(echo "$GEOM_LINE" | grep -oP '(?<=x)\d+' | head -1 || echo "1310")
            echo "Emulator window: ${WIN_W}x${WIN_H}"

            # Sidebar = total_width - android_screen_width (720)
            SIDEBAR=$(( WIN_W - 720 ))
            [ "$SIDEBAR" -lt "0" ] && SIDEBAR=0
            [ "$SIDEBAR" -gt "150" ] && SIDEBAR=52

            # Title bar height = total_height - android_screen_height (1280)
            TITLEBAR=$(( WIN_H - 1280 ))
            [ "$TITLEBAR" -lt "0" ] && TITLEBAR=0
            [ "$TITLEBAR" -gt "100" ] && TITLEBAR=30

            echo "Sidebar: ${SIDEBAR}px, Titlebar: ${TITLEBAR}px"

            # Move the window so the Android display starts exactly at (0,0)
            xdotool windowmove "$WID" -$SIDEBAR -$TITLEBAR 2>/dev/null || true
            echo "Android screen now at (0,0)"
          else
            echo "WARNING: emulator window not found"
          fi

          # 10. Start VNC: capture only 720x1280 starting from (0,0) - exactly the Android screen
          x11vnc -display :0 -clip 720x1280+0+0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -ncache 10 -shared -defer 0
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install Max and apply Kiosk Mode
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          $ADB kill-server 2>/dev/null || true
          sleep 2
          $ADB start-server
          sleep 2

          STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
          echo "ADB state: $STATE"
          if [ "$STATE" != "device" ]; then
            $ADB -s emulator-5554 reconnect offline 2>/dev/null || true
            sleep 5
            STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
            if [ "$STATE" != "device" ]; then
              echo "ERROR: Device not ready! State=$STATE"
              $ADB devices -l
              exit 1
            fi
          fi

          echo "Installing Max APK..."
          $ADB -s emulator-5554 install -r max.apk

          echo "Applying Kiosk Mode..."
          $ADB -s emulator-5554 shell settings put secure lockscreen.disabled 1
          $ADB -s emulator-5554 shell pm disable-user --user 0 com.android.systemui
          $ADB -s emulator-5554 shell settings put global window_animation_scale 0
          $ADB -s emulator-5554 shell settings put global transition_animation_scale 0
          $ADB -s emulator-5554 shell settings put global animator_duration_scale 0

          PACKAGE_NAME=$(aapt dump badging max.apk | grep '^package' | grep -oP "name='\K[^']+" | head -1 | tr -d '[:space:]')
          echo "Package: $PACKAGE_NAME"

          echo "Launching Max..."
          $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
