name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool x11-utils x11-xserver-utils scrcpy

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force

          echo "hw.lcd.width=720"   >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes"    >> $ANDROID_AVD_HOME/max_device.avd/config.ini

          avdmanager list avd

      - name: Setup Web UI
        run: |
          cat << 'EOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max Emulator</title>
              <style>
                  body { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; }
                  iframe { width: 720px; height: 1280px; border: none; display: none; transform-origin: top center; }
                  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              </style>
              <script>
                  function updateScale() {
                      var phoneRatio = 720 / 1280;
                      var windowRatio = window.innerWidth / window.innerHeight;
                      var scale;
                      
                      if (windowRatio < phoneRatio) {
                          // Mobile: Window is narrower than the phone. Fit by width.
                          scale = window.innerWidth / 720;
                      } else {
                          // PC: Window is wider than the phone. Fit by height.
                          scale = window.innerHeight / 1280;
                      }
                      
                      var f = document.getElementById('vnc-frame');
                      if(f) {
                          f.style.transform = 'scale(' + scale + ')';
                          document.body.style.height = (1280 * scale) + 'px';
                      }
                  }
                  window.addEventListener('resize', updateScale);

                  setTimeout(function() {
                      document.getElementById('loading').style.display = 'none';
                      var f = document.getElementById('vnc-frame');
                      f.src = 'vnc.html?autoconnect=true&resize=off&show_dot=true';
                      f.style.display = 'block';
                      updateScale();
                      f.onload = function() {
                          try {
                              var bar = f.contentDocument.getElementById('noVNC_control_bar_anchor');
                              if (bar) bar.style.display = 'none';
                          } catch(e) {}
                      };
                  }, 7000);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <h2>Установка и запуск эмулятора...</h2>
                  <p>Пожалуйста, подождите (до 60-90 секунд).</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          EOF

      - name: Start display, emulator and VNC
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # 1. Xvfb with HUGE screen so scrcpy doesn't shrink the window automatically
          Xvfb :0 -screen 0 2000x2000x24 &
          export DISPLAY=:0
          for i in $(seq 1 30); do
            xdpyinfo -display :0 >/dev/null 2>&1 && echo "Xvfb ready" && break
            sleep 1
          done

          # 2. Fluxbox: force window to 0,0 and no decorations
          mkdir -p ~/.fluxbox
          printf '[app] (.*)\n  [Deco] {NONE}\n  [Position] (UPPERLEFT) {0 0}\n[end]\n' > ~/.fluxbox/apps
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          fluxbox -display :0 2>/dev/null &
          sleep 2
          
          # Force black background to hide Ubuntu logo completely
          xsetroot -solid black -display :0 &

          # 3. Start ADB before emulator
          $ADB start-server
          echo "ADB daemon started"

          # 4. Start emulator with -no-window:
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -no-skin -no-metrics \
            -no-window &
          echo "Emulator started in headless mode"

          # 5. Wait for ADB online (up to 3 min)
          echo "Waiting for ADB..."
          for i in $(seq 1 36); do
            STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
            if [ "$STATE" = "device" ]; then
              echo "ADB online!"
              break
            fi
            if [ "$STATE" = "offline" ]; then
              $ADB -s emulator-5554 reconnect offline 2>/dev/null || true
            fi
            echo "ADB: $STATE ($i/36)"
            sleep 5
          done

          # 6. Wait for Android to fully boot
          echo "Waiting for Android boot..."
          for i in $(seq 1 60); do
            BOOT=$($ADB -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            echo "Boot: '$BOOT' ($i/60)"
            sleep 5
          done
          sleep 5

          # 7. Launch scrcpy (it will open at natural 720x1280 size because Xvfb is huge)
          DISPLAY=:0 scrcpy \
            -s emulator-5554 \
            --max-fps 30 \
            2>/dev/null &
          sleep 4
          echo "scrcpy rendering Android screen at 30fps"

          # 8. Start VNC capturing ONLY the 720x1280 region where scrcpy is
          x11vnc -display :0 -clip 720x1280+0+0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -ncache 10 -shared -defer 0
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install Max and apply Kiosk Mode
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Do NOT restart ADB - scrcpy is connected to it!
          STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
          echo "ADB state: $STATE"
          if [ "$STATE" != "device" ]; then
            echo "ERROR: Device not ready! State=$STATE"
            $ADB devices -l
            exit 1
          fi

          echo "Installing Max APK..."
          $ADB -s emulator-5554 install -r max.apk

          echo "Applying Kiosk Mode..."
          $ADB -s emulator-5554 shell settings put secure lockscreen.disabled 1
          # Keep System UI enabled so user has back/home buttons if they get stuck in browser
          # $ADB -s emulator-5554 shell pm disable-user --user 0 com.android.systemui
          $ADB -s emulator-5554 shell settings put global window_animation_scale 0
          $ADB -s emulator-5554 shell settings put global transition_animation_scale 0
          $ADB -s emulator-5554 shell settings put global animator_duration_scale 0

          PACKAGE_NAME=$(aapt dump badging max.apk | grep '^package' | grep -oP "name='\K[^']+" | head -1 | tr -d '[:space:]')
          echo "Package: $PACKAGE_NAME"

          echo "Launching Max..."
          $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000