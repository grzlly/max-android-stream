name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool x11-utils

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force

          # 720p screen, GPU on, physical keyboard enabled
          echo "hw.lcd.width=720"   >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes"    >> $ANDROID_AVD_HOME/max_device.avd/config.ini

          avdmanager list avd

      - name: Setup Web UI
        run: |
          cat << 'HTMLEOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { background: #000; overflow: hidden; }
                  iframe { width: 100vw; height: 100vh; border: none; display: none; }
                  #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
                             align-items: center; justify-content: center;
                             background: #111; color: #fff; font-family: sans-serif; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc;
                             border-radius: 50%; width: 48px; height: 48px;
                             animation: spin 1s linear infinite; margin-bottom: 20px; }
                  @keyframes spin { to { transform: rotate(360deg); } }
              </style>
              <script>
                  setTimeout(function() {
                      document.getElementById('loading').style.display = 'none';
                      var f = document.getElementById('vnc-frame');
                      f.src = 'vnc.html?autoconnect=true&resize=off&show_dot=true';
                      f.style.display = 'block';
                  }, 7000);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <p>Запуск...</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          HTMLEOF

      - name: Start display, window manager, emulator and VNC
        run: |
          # --- 1. Start Xvfb and WAIT until it is ready ---
          Xvfb :0 -screen 0 720x1280x24 &
          export DISPLAY=:0
          echo "Waiting for Xvfb..."
          for i in $(seq 1 30); do
            xdpyinfo -display :0 >/dev/null 2>&1 && echo "Xvfb ready" && break
            sleep 1
          done

          # --- 2. Start fluxbox (borderless, no toolbar) ---
          mkdir -p ~/.fluxbox
          cat > ~/.fluxbox/apps << 'FBEOF'
[app] (.*)
  [Deco] {NONE}
  [Position] (UPPERLEFT) {0 0}
[end]
FBEOF
          cat > ~/.fluxbox/init << 'FBEOF'
session.screen0.toolbar.visible: false
FBEOF
          fluxbox -display :0 2>/dev/null &
          sleep 2

          # --- 3. Start emulator (no-skin, no-metrics to suppress Qt popups) ---
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-skin \
            -no-metrics \
            -display :0 &

          echo "Emulator launched, waiting for its window and dismissing any popups..."

          # --- 4. Wait for the emulator Qt window, then dismiss popups & resize ---
          # Loop up to 90 seconds waiting for the qemu window to appear
          WID=""
          for i in $(seq 1 90); do
            WID=$(xdotool search --onlyvisible --class "qemu" 2>/dev/null | head -1 || true)
            if [ -n "$WID" ]; then
              echo "Found emulator window: $WID"
              break
            fi
            sleep 1
          done

          if [ -n "$WID" ]; then
            xdotool windowactivate "$WID" 2>/dev/null || true
            # Press Enter/Return several times with pauses to dismiss any warning dialogs
            for j in 1 2 3; do
              xdotool key --window "$WID" Return 2>/dev/null || true
              sleep 1
            done
            xdotool windowsize "$WID" 720 1280 2>/dev/null || true
            xdotool windowmove "$WID" 0 0 2>/dev/null || true
            echo "Window resized and positioned."
          else
            echo "WARNING: Could not find emulator window via xdotool."
          fi

          # --- 5. Wait for ADB device to be fully online (not just boot_completed) ---
          echo "Waiting for ADB device to come online..."
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Give emulator up to 3 minutes to have a stable online ADB connection
          for i in $(seq 1 36); do
            STATE=$($ADB get-state 2>/dev/null || echo "unknown")
            if [ "$STATE" = "device" ]; then
              echo "ADB is online (state=device)"
              break
            fi
            if [ "$STATE" = "offline" ]; then
              echo "ADB offline, reconnecting..."
              $ADB kill-server 2>/dev/null || true
              sleep 2
              $ADB start-server 2>/dev/null || true
              $ADB reconnect 2>/dev/null || true
            fi
            echo "ADB state: $STATE, waiting... ($i/36)"
            sleep 5
          done

          # Wait for Android to fully boot
          echo "Waiting for Android boot_completed..."
          for i in $(seq 1 60); do
            BOOT=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            echo "Boot status: $BOOT ($i/60)"
            sleep 5
          done

          # Small extra wait to let Google Play services settle
          sleep 5

          # --- 6. Start VNC ---
          x11vnc -display :0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -ncache 10 -shared -defer 0
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC is running on :8000"

      - name: Install Max and apply Kiosk Mode
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Fresh ADB connection for this step
          $ADB kill-server 2>/dev/null || true
          sleep 2
          $ADB start-server

          # Confirm device is still online
          STATE=$($ADB get-state 2>/dev/null || echo "unknown")
          echo "ADB state before install: $STATE"
          if [ "$STATE" != "device" ]; then
            echo "ERROR: Device not ready for install! State=$STATE"
            $ADB devices -l
            exit 1
          fi

          # Install APK
          echo "Installing Max APK..."
          $ADB install -r max.apk

          # --- Kiosk Mode ---
          echo "Applying Kiosk Mode..."

          # Disable lock screen
          $ADB shell settings put secure lockscreen.disabled 1

          # Kill SystemUI completely (removes status bar, nav bar, notification shade)
          $ADB shell pm disable-user --user 0 com.android.systemui

          # Kill all animations (instant app response)
          $ADB shell settings put global window_animation_scale 0
          $ADB shell settings put global transition_animation_scale 0
          $ADB shell settings put global animator_duration_scale 0

          # Detect package and launch
          PACKAGE_NAME=$(aapt dump badging max.apk | grep '^package' | grep -oP "name='\K[^']+'" | tr -d "'")
          echo "Package: $PACKAGE_NAME"

          echo "Launching Max..."
          $ADB shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
