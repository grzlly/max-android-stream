name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify unzip openjdk-17-jdk wget

      - name: Setup Android SDK and Create AVD
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          
          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null
          
          echo "Installing packages..."
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          
          echo "Creating AVD..."
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force
          
          echo "Checking AVDs..."
          avdmanager list avd

      - name: Start virtual display + emulator + VNC
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          
          # Virtual display 1080x1920
          Xvfb :0 -screen 0 1080x1920x24 &
          export DISPLAY=:0
          
          # Start emulator
          emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -skin 1080x1920 &

          # Wait for boot
          adb wait-for-device
          echo "Waiting for full boot..."
          for i in $(seq 1 90); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && echo "Booted!" && break
            sleep 5
          done

          # x11vnc on virtual display
          x11vnc -display :0 -forever -nopw -rfbport 5900 -bg -quiet

          # noVNC websockify on port 8000
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install and launch Max
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          
          echo "Installing Max APK..."
          adb install -r max.apk || true
          echo "Launching Max..."
          adb shell monkey -p com.vk.im -c android.intent.category.LAUNCHER 1 || true

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
