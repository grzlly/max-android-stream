name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force
          
          # Fix for popup warnings
          echo "hw.cpu.ncore=2" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          
          avdmanager list avd

      - name: Setup Web UI
        run: |
          cat << 'EOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Max</title>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { background: #0a0a0a; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
                  #vnc-frame { width: 100%; height: 100vh; border: none; display: none; background: #000; }
                  #loading {
                      position: fixed; inset: 0;
                      display: flex; flex-direction: column;
                      align-items: center; justify-content: center;
                      gap: 20px; background: #0a0a0a;
                  }
                  .logo { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; color: #fff; }
                  .logo span { color: #e50914; }
                  .spinner {
                      width: 44px; height: 44px;
                      border: 3px solid rgba(255,255,255,0.1);
                      border-top-color: #e50914;
                      border-radius: 50%;
                      animation: spin 0.8s linear infinite;
                  }
                  @keyframes spin { to { transform: rotate(360deg); } }
                  .status { font-size: 0.9rem; color: rgba(255,255,255,0.4); }
              </style>
              <script>
                  setTimeout(() => {
                      document.getElementById('loading').style.display = 'none';
                      const f = document.getElementById('vnc-frame');
                      f.src = 'vnc.html?autoconnect=true&resize=scale&show_dot=true';
                      f.style.display = 'block';
                  }, 2500);
              </script>
          </head>
          <body>
              <div id="loading">
                  <div class="logo">M<span>A</span>X</div>
                  <div class="spinner"></div>
                  <p class="status">Подключение к сессии...</p>
              </div>
              <iframe id="vnc-frame" allowfullscreen></iframe>
          </body>
          </html>
          EOF

      - name: Start virtual display + emulator + VNC
        run: |
          Xvfb :0 -screen 0 1080x1920x24 &
          export DISPLAY=:0
          
          # Force emulator window to be fullscreen and borderless
          mkdir -p ~/.fluxbox
          cat << 'EOF' > ~/.fluxbox/apps
          [app] (.*)
            [Deco] {NONE}
            [Maximized] {yes}
          [end]
          EOF
          fluxbox -display :0 &
          
          # Start emulator
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -skin 1080x1920 &

          # Wait for boot
          $ANDROID_HOME/platform-tools/adb wait-for-device
          echo "Waiting for full boot..."
          for i in $(seq 1 90); do
            boot=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && echo "Booted!" && break
            sleep 5
          done

          # x11vnc on virtual display
          x11vnc -display :0 -forever -nopw -rfbport 5900 -bg -quiet

          # noVNC websockify on port 8000
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install and launch Max
        run: |
          echo "Installing Max APK..."
          $ANDROID_HOME/platform-tools/adb install -r max.apk || true
          echo "Launching Max..."
          $ANDROID_HOME/platform-tools/adb shell monkey -p com.vk.im -c android.intent.category.LAUNCHER 1 || true

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
