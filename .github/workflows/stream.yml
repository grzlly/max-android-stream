name: Max Android Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk
          echo "APK: $(du -sh max.apk)"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify wget unzip openjdk-17-jdk

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d /tmp/cmdtools
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/emulator" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install emulator + system image
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n max_device \
            -k "system-images;android-30;google_apis;x86_64" \
            --device "pixel_3"

      - name: Start virtual display + emulator + VNC
        run: |
          # Virtual display 1080x1920
          Xvfb :0 -screen 0 1080x1920x24 &
          export DISPLAY=:0
          echo "DISPLAY=:0" >> $GITHUB_ENV

          # Start emulator
          $HOME/android-sdk/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot &

          # Wait for boot
          adb wait-for-device
          echo "Waiting for full boot..."
          for i in $(seq 1 90); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && echo "Booted!" && break
            sleep 5
          done

          # x11vnc on virtual display
          x11vnc -display :0 -forever -nopw -rfbport 5900 -bg -quiet

          # noVNC websockify on port 8000
          websockify --web=/usr/share/novnc 8000 localhost:5900 &
          echo "noVNC running on :8000"

      - name: Install and launch Max
        run: |
          echo "Installing Max APK..."
          adb install -r max.apk
          echo "Launching Max..."
          adb shell monkey -p com.vk.im -c android.intent.category.LAUNCHER 1
          echo "Max launched"

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/vps_key \
              -fN \
              -R 8000:localhost:8000 \
              root@$VPS_HOST
          echo "Tunnel open -> https://max.grzly.ru"

      - name: Keep alive (up to 5h 50min)
        run: |
          echo "Live at https://max.grzly.ru"
          sleep 20000
