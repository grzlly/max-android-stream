name: Node 3 Stream (VNC)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/node3.yml'

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_ID: 3
      TUNNEL_PORT: 8103
      PACKAGE_NAME: ""
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${ secrets.VPS_SSH_KEY }
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Download APK from VPS
        env:
          VPS_HOST: ${ secrets.VPS_HOST }
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vps_key root@$VPS_HOST:/opt/max/max.apk ./max.apk

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libgl1 fluxbox aapt xdotool x11-utils x11-xserver-utils scrcpy nodejs npm

      - name: Setup Web UI and Orchestrator
        run: |
          PACKAGE_NAME=$(aapt dump badging ./max.apk 2>/dev/null | grep "^package" | grep -oP "name='\K[^']+" | head -1 || echo "com.vk.im")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          
          mkdir -p /opt/orchestrator
          cd /opt/orchestrator
          npm init -y
          npm install express http-proxy-middleware

          cat << HTMLEOF | sudo tee /opt/orchestrator/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Max Node 3</title>
              <style>
                  body { margin: 0; padding: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; }
                  iframe { width: 720px; height: 1280px; min-width: 720px; min-height: 1280px; flex-shrink: 0; border: none; display: none; transform-origin: top center; }
                  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; padding: 20px; box-sizing: border-box; }
                  .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
                  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
              </style>
          </head>
          <body>
              <div id="loading">
                  <div class="spinner"></div>
                  <h2 id="status-text">Запуск эмулятора (Node 3)...</h2>
                  <p>Это может занять 1-2 минуты</p>
              </div>
              
              <iframe id="vnc-frame" src=""></iframe>

              <script>
                  const loading = document.getElementById('loading');
                  const statusText = document.getElementById('status-text');
                  const iframe = document.getElementById('vnc-frame');
                  
                  function resize() {
                      const pr = 720 / 1280;
                      const wr = window.innerWidth / window.innerHeight;
                      const scale = wr < pr ? window.innerWidth / 720 : window.innerHeight / 1280;
                      iframe.style.transform = 'scale(' + scale + ')';
                      document.body.style.height = (1280 * scale) + 'px';
                  }
                  window.addEventListener('resize', resize);
                  resize();

                  function checkStatus() {
                      fetch('/node3/api/status')
                          .then(r => r.json())
                          .then(data => {
                              if (data.ready) {
                                  loading.style.display = 'none';
                                  iframe.style.display = 'block';
                                  const host = window.location.hostname;
                                  const port = window.location.port;
                                  const path = 'node3/websockify';
                                  const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                                  iframe.src = '/node3/vnc.html?autoconnect=true&resize=scale&host=' + host + '&port=' + port + '&path=' + path;
                              } else {
                                  statusText.textContent = 'Приложение запускается...';
                                  setTimeout(checkStatus, 3000);
                              }
                          })
                          .catch(() => {
                              statusText.textContent = 'Подключение к серверу...';
                              setTimeout(checkStatus, 3000);
                          });
                  }
                  checkStatus();
              </script>
          </body>
          </html>
          HTMLEOF

          cat << JSEOF | sudo tee /opt/orchestrator/server.js
          const express = require('express');
          const { createProxyMiddleware } = require('http-proxy-middleware');
          const { execSync } = require('child_process');
          
          const app = express();
          const ADB = process.env.ANDROID_HOME + '/platform-tools/adb';
          const PACKAGE = '\$PACKAGE_NAME';
          let isReady = false;

          setTimeout(() => { isReady = true; }, 30000);

          app.post('/api/reset', (req, res) => {
            console.log('[Node] Reset requested...');
            isReady = false;
            try {
              execSync(ADB + ' -s emulator-5554 shell pm clear ' + PACKAGE, { timeout: 15000 });
              execSync(ADB + ' -s emulator-5554 shell monkey -p ' + PACKAGE + ' -c android.intent.category.LAUNCHER 1', { timeout: 10000 });
              setTimeout(() => { isReady = true; }, 3000);
              res.json({ ok: true });
            } catch(e) {
              isReady = true;
              res.json({ ok: true, warn: e.message });
            }
          });

          app.get('/api/status', (req, res) => {
              res.json({ ready: isReady });
          });

          const wsProxy = createProxyMiddleware({ target: 'http://127.0.0.1:8001', ws: true, changeOrigin: true });
            app.use('/websockify', wsProxy);

          app.get('/', (req, res) => {
              res.sendFile(__dirname + '/index.html');
          });

          app.use(express.static('/usr/share/novnc'));

          const server = app.listen(8000, '0.0.0.0', () => console.log('Orchestrator running on port 8000'));
            server.on('upgrade', wsProxy.upgrade);
          JSEOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore AVD Cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.android/avd
            /usr/local/lib/android/sdk/system-images
          key: avd-node-v1

      - name: Build AVD and Snapshot (If not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          mkdir -p $ANDROID_AVD_HOME
          echo "y" | sdkmanager "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n max_device -k "system-images;android-30;google_apis;x86_64" --force

          echo "hw.lcd.width=720"   >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.height=1280" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.lcd.density=320" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.gpu.enabled=yes" >> $ANDROID_AVD_HOME/max_device.avd/config.ini
          echo "hw.keyboard=yes"    >> $ANDROID_AVD_HOME/max_device.avd/config.ini

          # Start Emulator for Cold Boot
          $ANDROID_HOME/emulator/emulator @max_device -no-audio -no-boot-anim -gpu swiftshader_indirect -no-window >/dev/null 2>&1 &
          
          echo "Waiting for ADB..."
          adb wait-for-device
          
          echo "Waiting for Android boot..."
          for i in $(seq 1 60); do
            BOOT=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            sleep 5
          done
          sleep 5

          echo "Installing Apps and Configurations..."
          wget -qO simple.apk https://github.com/rkkr/simple-keyboard/releases/download/146/app-release.apk
          wget -qO appium.apk https://github.com/appium/io.appium.settings/releases/download/v8.0.8/settings_apk-debug.apk
          adb -s emulator-5554 install -r appium.apk
          adb -s emulator-5554 shell pm grant io.appium.settings android.permission.CHANGE_CONFIGURATION
          adb -s emulator-5554 shell am broadcast -a io.appium.settings.locale -n io.appium.settings/.receivers.LocaleSettingReceiver --es lang ru --es country RU
          sleep 3
          adb -s emulator-5554 install -r simple.apk
          sleep 5
          IME_ID=$(adb -s emulator-5554 shell ime list -a | grep -o "[^ :]*simplekeyboard[^ :]*" | head -1 | tr -d '\r' | tr -d '\n')
          [ -z "$IME_ID" ] && IME_ID="rkr.simplekeyboard.inputmethod/.latin.LatinIME"
          adb -s emulator-5554 shell ime enable "$IME_ID"
          adb -s emulator-5554 shell ime set "$IME_ID"
          adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.inputmethod.latin || true
          adb -s emulator-5554 shell pm disable-user --user 0 com.android.inputmethod.latin || true

          adb -s emulator-5554 install -r max.apk
          adb -s emulator-5554 shell settings put secure lockscreen.disabled 1
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell settings put global policy_control immersive.full=*
          adb -s emulator-5554 shell pm disable-user --user 0 com.android.chrome >/dev/null 2>&1 || true
          
          echo "Gracefully shutting down to save snapshot..."
          adb -s emulator-5554 emu kill
          while pgrep -x emulator >/dev/null; do sleep 1; done
          echo "Snapshot saved!"

      - name: Save AVD Cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.android/avd
            /usr/local/lib/android/sdk/system-images
          key: avd-node-v1

      - name: Start display, emulator and VNC
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          PACKAGE_NAME="${ env.PACKAGE_NAME }"

          # 1. Xvfb with HUGE screen
          Xvfb :0 -screen 0 1000x1500x24 +extension DAMAGE >/dev/null 2>&1 &
          export DISPLAY=:0
          for i in $(seq 1 30); do
            xdpyinfo -display :0 >/dev/null 2>&1 && echo "Xvfb ready" && break
            sleep 1
          done

          # 2. Fluxbox: force window to 0,0
          mkdir -p ~/.fluxbox
          printf '[app] (.*)\n  [Deco] {NONE}\n  [Position] (UPPERLEFT) {0 0}\n[end]\n' > ~/.fluxbox/apps
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          fluxbox -display :0 >/dev/null 2>&1 &
          sleep 2
          
          xsetroot -solid black -display :0 >/dev/null 2>&1 &

          # 3. Start ADB
          $ADB start-server
          echo "ADB daemon started"

          # 4. Start emulator from Snapshot!
          $ANDROID_HOME/emulator/emulator @max_device \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-window >/dev/null 2>&1 &

          echo "Waiting for ADB..."
          for i in $(seq 1 36); do
            STATE=$($ADB -s emulator-5554 get-state 2>/dev/null || echo "unknown")
            [ "$STATE" = "device" ] && echo "ADB online!" && break
            [ "$STATE" = "offline" ] && $ADB -s emulator-5554 reconnect offline 2>/dev/null || true
            sleep 5
          done

          echo "Waiting for Android boot..."
          for i in $(seq 1 60); do
            BOOT=$($ADB -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            [ "$BOOT" = "1" ] && echo "Android booted!" && break
            sleep 5
          done
          sleep 5

          # 5. Launch scrcpy
          (
            while true; do
              DISPLAY=:0 scrcpy -s emulator-5554 --max-fps 30 --crop 720:1232:0:48 2>/dev/null
              sleep 2
            done
          ) &
          sleep 4

          # 6. Start VNC
          if xdpyinfo -display :0 -queryExtensions | grep -q DAMAGE; then
            x11vnc -display :0 -clip 720x1280+0+0 -forever -nopw -rfbport 5900 -bg -quiet -noncache -shared -defer 0
          else
            x11vnc -display :0 -clip 720x1280+0+0 -forever -nopw -rfbport 5900 -bg -quiet -noxdamage -wait 10 -noncache -shared -defer 0
          fi
          
          # 7. Start websockify
          websockify 8001 localhost:5900 >/dev/null 2>&1 &

          # 8. Start Orchestrator
          export ANDROID_HOME=$ANDROID_HOME
          cd /opt/orchestrator
          node server.js >/dev/null 2>&1 &
          
          echo "Launching $PACKAGE_NAME..."
          $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
            
          echo "Notifying balancer that Node 3 is ready..."
          curl -s -o /dev/null -X POST http://185.194.177.44:8000/ping -H "Content-Type: application/json" -d '{"nodeId": "3", "status": "ready"}' || true

          echo "Starting watchdog..."
          (
            set +e
            while true; do
              FOCUS=$($ADB -s emulator-5554 shell dumpsys window windows 2>/dev/null | grep -E 'mCurrentFocus' | awk -F'/' '{print $1}' | awk '{print $NF}' | tr -d '\r')
              if [ -n "$FOCUS" ] && [ "$FOCUS" != "mCurrentFocus=null" ]; then
                if [ "$FOCUS" != "$PACKAGE_NAME" ] && \
                   [ "$FOCUS" != "com.android.permissioncontroller" ] && \
                   [ "$FOCUS" != "rkr.simplekeyboard.inputmethod" ]; then
                  [ "$FOCUS" != "android" ] && $ADB -s emulator-5554 shell am force-stop "$FOCUS" >/dev/null 2>&1 || true
                  $ADB -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
            
                  curl -s -o /dev/null -X POST http://185.194.177.44:8000/ping -H "Content-Type: application/json" -d '{"nodeId": "3", "status": "ready"}' || true
                fi
              fi
              sleep 2
            done
          ) &

      - name: Open SSH Reverse Tunnel to VPS
        env:
          VPS_HOST: ${ secrets.VPS_HOST }
        run: |
          (
            while true; do
              ssh -o StrictHostKeyChecking=no \
                  -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=10 \
                  -i ~/.ssh/vps_key \
                  -N \
                  -R ${ env.TUNNEL_PORT }:localhost:8000 \
                  root@$VPS_HOST || true
              echo "SSH tunnel died. Restarting in 5 seconds..."
              sleep 5
            done
          ) &
          echo "Tunnel loop started: Node ${ env.NODE_ID } -> VPS:${ env.TUNNEL_PORT }"

      - name: Keep alive (up to 5h 50min)
        run: |
          sleep 20000
